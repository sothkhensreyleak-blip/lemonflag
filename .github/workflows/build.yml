name: Build Lemonflag

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '25'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.14'

  - name: Build
    run: gradle clean build

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: LemonFlag-JAR
      path: build/libs/*.jar
