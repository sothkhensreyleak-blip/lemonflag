name: Build LemonFlag

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Plugin
        run: mvn -B clean package

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: LemonFlag-3.1.0
          path: target/*.jar
