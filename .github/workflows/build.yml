
name: Build LemonFlag

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Plugin
        run: gradle clean build

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: LemonFlag-3.0.0
          path: build/libs/*.jar
