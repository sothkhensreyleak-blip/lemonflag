# ប្រសិនបើរក IP មិនឃើញ ឬលេង Localhost/Proxy វានឹងប្រើទង់ជាតិកម្ពុជា (🇰🇭) ដោយស្វ័យប្រវត្តិ
default-flag: "🇰🇭"

messages:
  no-permission: "&cអ្នកមិនមានសិទ្ធិប្រើ Command នេះទេ!"
  reloaded: "&aបានផ្ទុក Config របស់ LemonFlag ឡើងវិញដោយជោគជ័យ!"
  player-not-found: "&cរកមិនឃើញ Player ឈ្មោះ {player} នៅ Online ទេ!"
  invalid-code: "&cមិនមានកូដប្រទេស {code} នៅក្នុង config.yml ទេ!"
  flag-set: "&aបានប្តូរទង់ជាតិរបស់ &e{player} &aទៅជា {flag} &a({code})!"
  usage: "&eប្រើប្រាស់៖ /lemonflag <reload | set <player> <countryCode>>"

# ទង់ជាតិតាមប្រទេស (Country Code)
flags:
  KH: "🇰🇭" # Cambodia
  TH: "🇹🇭" # Thailand
  VN: "🇻🇳" # Vietnam
  LA: "🇱🇦" # Laos
  US: "🇺🇸" # United States
  SG: "🇸🇬" # Singapore
  MY: "🇲🇾" # Malaysia
  JP: "🇯🇵" # Japan
  KR: "🇰🇷" # South Korea
  CN: "🇨🇳" # China
  PH: "🇵🇭" # Philippines
  ID: "🇮🇩" # Indonesia
  FR: "🇫🇷" # France
  GB: "🇬🇧" # United Kingdom
  AU: "🇦🇺" # Australia
  CA: "🇨🇦" # Canada
  DE: "🇩🇪" # Germany
  IN: "🇮🇳" # India
