name: LemonFlag
version: 1.1
main: com.lemon.flag.LemonFlag
api-version: '1.20'
depend: [PlaceholderAPI]
author: Lemon
description: Show player country flags via PlaceholderAPI

commands:
  lemonflag:
    description: Manage LemonFlag plugin
    usage: /lemonflag <reload|set>
    aliases: [lflag, lf]
    permission: lemonflag.admin

permissions:
  lemonflag.admin:
    description: Allows reloading config and setting player flags
    default: op
