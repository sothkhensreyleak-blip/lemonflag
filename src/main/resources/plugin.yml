name: LemonFlag
version: 1.3
main: com.lemon.flag.LemonFlag
api-version: '1.20'
depend: [PlaceholderAPI]
author: Lemon
description: Shows Cambodia flag emoji via %lemon_flag%

commands:
  lemonflag:
    description: Manage LemonFlag plugin
    usage: /lemonflag <reload|set>
    aliases: [lflag, lf]
    permission: lemonflag.admin

permissions:
  lemonflag.admin:
    description: Allows reloading config and setting player flag icon
    default: op
